name: CD Pipeline

on:
  push:
    branches: [main] # Trigger the workflow on push to the main branch

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Docker Hub using secrets for security
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Build the Docker image from the current directory
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ink:latest .

      # Push the built image to the Docker Hub registry
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ink:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push # Ensures deployment only happens after a successful build

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Connect to the remote server via SSH and deploy the new image
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd server  # Navigate to the project directory on the server (Adjust 'server' if the folder name is different)
            
            # Stop currently running containers
            docker compose down --remove-orphans 
            
            # Force remove stopped service containers
            docker compose rm -f 
            
            # Pull the latest Docker images
            docker compose pull 
            
            # Start the services in detached mode
            docker compose up -d 
            
            # Remove unused "dangling" images
            docker image prune -f
